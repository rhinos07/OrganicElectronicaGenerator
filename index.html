<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Organic Electronica Generator</title>
  <meta name="description" content="Generative organic electronica in the browser: interlocking kalimba and bell patterns, warm house grooves, downtempo and nu-jazz.">
  <meta name="theme-color" content="#0d1f1c">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-style="organic">
  <canvas id="visual" aria-hidden="true"></canvas>

  <header class="top">
    <h1>Organic Electronica <span>Generator</span></h1>
    <p id="now" class="now" aria-live="polite">Press play to start</p>
  </header>

  <main id="panel" class="panel">
    <div class="row main-row">
      <button id="play" class="play" aria-label="Play">
        <svg viewBox="0 0 24 24" class="icon-play"><path d="M7 4.5v15l13-7.5z"/></svg>
        <svg viewBox="0 0 24 24" class="icon-stop"><path d="M6 5h4.5v14H6zM13.5 5H18v14h-4.5z"/></svg>
      </button>
      <div class="styles" role="radiogroup" aria-label="Style" id="styles"></div>
    </div>

    <div class="row controls">
      <label class="control">
        <span>Tempo <output id="tempo-value"></output></span>
        <input id="tempo" type="range" step="1">
      </label>
      <label class="control">
        <span>Key</span>
        <select id="key"></select>
      </label>
      <label class="control">
        <span>Energy <output id="energy-value"></output></span>
        <input id="energy" type="range" min="0" max="100" step="1">
      </label>
      <label class="control">
        <span>Volume <output id="volume-value"></output></span>
        <input id="volume" type="range" min="0" max="100" step="1">
      </label>
    </div>

    <section class="mixer-box" aria-label="Mixer">
      <div class="mixer-head">
        <span>Mixer</span>
        <button id="mixer-reset" class="link">Reset</button>
      </div>
      <div class="mixer" id="mixer"></div>
    </section>

    <div class="row actions">
      <button id="variation" class="secondary">New variation</button>
      <label class="export">
        <select id="export-length" aria-label="Export length">
          <option value="120">2 min</option>
          <option value="240" selected>4 min</option>
          <option value="360">6 min</option>
        </select>
        <button id="export" class="secondary">Export WAV</button>
      </label>
      <span id="status" class="status" aria-live="polite"></span>
    </div>

    <p class="hint">Space play/stop · N new variation · 1–3 style · M mute · H hide panel</p>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
